<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enterprise SaaS Task Manager</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.85);
      --border: rgba(255, 255, 255, 0.12);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --danger: #ef4444;
      --success: #10b981;
      --radius: 10px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 1.5rem;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 1rem 1.5rem;
      border-radius: var(--radius);
      margin-bottom: 1.5rem;
    }
    button {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: var(--primary-hover); }
    .btn-danger { background: var(--danger); }
    .btn-danger:hover { background: #dc2626; }
    main {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 1.5rem;
      flex: 1;
    }
    @media (max-width: 768px) {
      main { grid-template-columns: 1fr; }
    }
    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    input, select, textarea {
      width: 100%;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.6rem;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    .task-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      padding: 1rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .task-meta { display: flex; gap: 0.5rem; margin-top: 0.4rem; font-size: 0.85rem; color: var(--text-muted); }
    .badge {
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
    }
    .actions { display: flex; gap: 0.5rem; }
    footer {
      text-align: center;
      margin-top: 2rem;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Enterprise Capstone: SaaS Task Manager</h1>
    <div id="auth-box">
      <span id="user-display" style="margin-right: 1rem;">Guest Session</span>
      <button id="auth-btn" type="button">Login (Demo)</button>
    </div>
  </header>

  <main>
    <!-- CRUD: Create Task -->
    <aside class="panel">
      <h2>Create New Task</h2>
      <p style="color: var(--text-muted); margin-bottom: 1rem; font-size: 0.85rem;">Persists instantly to local storage state.</p>
      <form id="task-form">
        <div>
          <label for="task-title">Task Title</label>
          <input type="text" id="task-title" required placeholder="e.g. Audit API routes">
        </div>
        <div>
          <label for="task-priority">Priority</label>
          <select id="task-priority">
            <option value="High">High</option>
            <option value="Medium" selected>Medium</option>
            <option value="Low">Low</option>
          </select>
        </div>
        <button type="submit">Add Task</button>
      </form>
    </aside>

    <!-- CRUD: Read, Update, Delete -->
    <section class="panel">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
        <h2>Active Task Inventory</h2>
        <span id="task-count" class="badge">0 items</span>
      </div>
      <div id="tasks-container">
        <!-- Rendered dynamically -->
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Production Capstone - RabTech Academy Milestone 06</p>
  </footer>

  <script>
    // State Management & Local Storage
    const STORAGE_KEY = 'capstone_tasks_prod';
    const AUTH_KEY = 'capstone_auth_user';

    let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [
      { id: '1', title: 'Setup WCAG 2.1 Contrast Testing', priority: 'High' },
      { id: '2', title: 'Deploy to Cloud Infrastructure', priority: 'Medium' }
    ];

    let currentUser = localStorage.getItem(AUTH_KEY) || null;

    // DOM Elements
    const authBtn = document.getElementById('auth-btn');
    const userDisplay = document.getElementById('user-display');
    const taskForm = document.getElementById('task-form');
    const tasksContainer = document.getElementById('tasks-container');
    const taskCount = document.getElementById('task-count');

    // Auth Simulation
    function updateAuthUI() {
      if (currentUser) {
        userDisplay.textContent = `Signed in: ${currentUser}`;
        authBtn.textContent = 'Logout';
      } else {
        userDisplay.textContent = 'Guest Session';
        authBtn.textContent = 'Login (Demo)';
      }
    }

    authBtn.addEventListener('click', () => {
      if (currentUser) {
        currentUser = null;
        localStorage.removeItem(AUTH_KEY);
      } else {
        currentUser = 'Lead Developer (demo@company.com)';
        localStorage.setItem(AUTH_KEY, currentUser);
      }
      updateAuthUI();
    });

    // Render CRUD Elements
    function renderTasks() {
      tasksContainer.innerHTML = '';
      taskCount.textContent = `${tasks.length} tasks`;

      if (tasks.length === 0) {
        tasksContainer.innerHTML = `<p style="color: var(--text-muted); text-align:center; padding: 2rem;">No open tasks remaining.</p>`;
        return;
      }

      tasks.forEach(task => {
        const card = document.createElement('div');
        card.className = 'task-card';
        card.innerHTML = `
          <div>
            <strong>${task.title}</strong>
            <div class="task-meta">
              <span class="badge">${task.priority} Priority</span>
              <span>ID: ${task.id}</span>
            </div>
          </div>
          <div class="actions">
            <button onclick="editTask('${task.id}')" style="background:#475569;">Edit</button>
            <button class="btn-danger" onclick="deleteTask('${task.id}')">Delete</button>
          </div>
        `;
        tasksContainer.appendChild(card);
      });
    }

    function saveAndRender() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      renderTasks();
    }

    // CRUD: Create
    taskForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const title = document.getElementById('task-title').value.trim();
      const priority = document.getElementById('task-priority').value;

      tasks.push({
        id: Date.now().toString().slice(-4),
        title,
        priority
      });

      taskForm.reset();
      saveAndRender();
    });

    // CRUD: Delete
    window.deleteTask = function(id) {
      tasks = tasks.filter(t => t.id !== id);
      saveAndRender();
    };

    // CRUD: Update
    window.editTask = function(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;
      const updated = prompt('Edit task description:', task.title);
      if (updated !== null && updated.trim() !== '') {
        task.title = updated.trim();
        saveAndRender();
      }
    };

    // Init
    updateAuthUI();
    renderTasks();
  </script>
</body>
</html>
